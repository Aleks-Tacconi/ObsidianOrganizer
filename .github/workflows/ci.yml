name: CI Pipeline

on:
  push:
    branches:
      - main
      - Issue-2
  pull_request:
    branches:
      - main

jobs:
  lint:
    runs-on: ubuntu-latest
    name: Run Python and React linting

    steps:
    - name: Checkout code
      uses: actions/checkout@v2

    - name: Install Poetry
      run: |
        curl -sSL https://install.python-poetry.org | python3 -

    - name: Set up Python
      uses: actions/setup-python@v2
      with:
        python-version: '3.13'

    - name: Install dependencies (Python and Node.js)
      run: |
        sudo apt-get install make
        make backend-install
        make frontend-install

    - name: Run backend linting (Python with pylint)
      run: |
        pylint_output=$(make backend-lint) 
        echo "$pylint_output"
        
        score=$(echo "$pylint_output" | grep "Your code has been rated" | sed 's/.*rated at \([0-9]*\.[0-9]*\)\/10/\1/')
        
        threshold=9.0
        
        if (( $(echo "$score < $threshold" | bc -l) )); then
          echo "pylint score of $score is below threshold of $threshold. Failing the build."
          exit 1
        fi
    - name: Run frontend linting (React with eslint)
      run: make frontend-lint

  test:
    runs-on: ubuntu-latest
    name: Run Python and React tests

    steps:
    - name: Checkout code
      uses: actions/checkout@v2

    - name: Install Poetry
      run: |
        curl -sSL https://install.python-poetry.org | python3 -

    - name: Set up Python
      uses: actions/setup-python@v2
      with:
        python-version: '3.13'

    - name: Install dependencies (Python and Node.js)
      run: |
        sudo apt-get install make
        make backend-install
        make frontend-install

    - name: Run backend tests (Python with pytest)
      run: make backend-test
